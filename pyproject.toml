[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "identifier-free-code-embedding"
version = "0.1.0"
description = "Train and evaluate identifier-free code-embedding models that locate functions by what they do rather than how they are named."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Eric Wolos" }, { name = "Michael Doyle" }]
maintainers = [
    { name = "Eric Wolos", email = "ewolos015@gmail.com" },
    { name = "Michael Doyle" },
]
keywords = [
    "code-embedding",
    "contrastive-learning",
    "decompilation",
    "information-retrieval",
    "binary-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Slim, broadly-portable core so a baseline install is importable on CPU/macOS.
# Heavy / GPU-only dependencies live in the optional extras below and are
# imported lazily by the modules that need them.
dependencies = [
    "datasets>=4.4.2",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.12.5",
    "pyyaml>=6.0",
    "requests>=2.31",
    "scikit-learn>=1.8.0",
    "scipy>=1.11",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.2.0",
    "torch>=2.9,<3",
    "tqdm>=4.66",
    "transformers>=4.57.3",
]

[project.optional-dependencies]
# Distributed / quantized training (requires a CUDA toolchain).
train = [
    "accelerate>=1.12.0",
    "bitsandbytes>=0.49.2",
    "deepspeed>=0.18.4",
    "tensorboard>=2.20.0",
]
# High-throughput offline / served inference (Linux + CUDA).
serve = ["vllm>=0.13.0"]
# Extra evaluation backends (BGE-M3 via FlagEmbedding; OpenAI-compatible client).
eval = [
    "flagembedding>=1.3.5",
    "openai>=1.40",
]
all = [
    "identifier-free-code-embedding[train,serve,eval]",
]

[project.scripts]
ifce-experiment = "ifce.cli.conduct_experiment:conduct_experiment"
ifce-train = "ifce.cli.train:main"
ifce-time = "ifce.cli.time_embeddings:cli_main"

[project.urls]
Homepage = "https://github.com/MITRE-Identifier-Free-Code-Embedding"
Repository = "https://github.com/MITRE-Identifier-Free-Code-Embedding/Identifier-Free-Code-Embedding"
Issues = "https://github.com/MITRE-Identifier-Free-Code-Embedding/Identifier-Free-Code-Embedding/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ifce"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# E501 (line length) is left to the formatter.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
